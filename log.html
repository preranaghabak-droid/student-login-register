<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

.login-container{
    width:100%;
    display:flex;
    justify-content:center;
}

.login-box{
    width:350px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    text-align:center;
}

.login-box h1{
    color:#2575fc;
    margin-bottom:20px;
}

.login-box input,
.login-box select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#2575fc;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#1d5fd0;
}

#message{
    margin-top:15px;
    color:green;
    font-weight:bold;
    font-size:18px;
}
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h1>🎓 Student Login</h1>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Student ID" required>

            <input type="password" id="password" placeholder="Password" required>

            <select required>
                <option value="">Select Course</option>
                <option>MCA</option>
                <option>MBA</option>
                <option>BCA</option>
                <option>B.Tech</option>
            </select>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    document.getElementById("message").innerHTML =
    "✅ Login Successful!";
});
</script>

</body>
</html>
