<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#6a11cb);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#2575fc;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input[type=text],
input[type=email],
input[type=password],
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2575fc;
    outline:none;
}

.radio-group,
.checkbox-group{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin:10px 0 15px;
}

.radio-group label,
.checkbox-group label{
    display:flex;
    align-items:center;
    gap:5px;
    font-weight:normal;
}

button{
    width:100%;
    padding:12px;
    background:#2575fc;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#174ec9;
}

#message{
    text-align:center;
    color:green;
    margin-top:15px;
    font-weight:bold;
    font-size:18px;
}

.login{
    text-align:center;
    margin-top:15px;
}

.login a{
    color:#2575fc;
    text-decoration:none;
    font-weight:bold;
}

.login a:hover{
    text-decoration:underline;
}

/* Responsive */

@media(max-width:768px){

.container{
    padding:25px;
}

}

@media(max-width:480px){

.container{
    max-width:100%;
    padding:20px;
}

h2{
    font-size:24px;
}

button{
    font-size:16px;
}

.radio-group,
.checkbox-group{
    flex-direction:column;
    gap:10px;
}

}
/* ===========================
   Responsive Media Queries
=========================== */

/* Large Tablets */
@media screen and (max-width: 992px) {

.container{
    max-width:500px;
    padding:25px;
}

}

/* Tablets */
@media screen and (max-width:768px){

body{
    padding:15px;
}

.container{
    width:100%;
    max-width:450px;
    padding:22px;
}

h2{
    font-size:26px;
}

input,
select,
textarea{
    font-size:15px;
    padding:11px;
}

button{
    font-size:17px;
    padding:12px;
}

}

/* Mobile Phones */
@media screen and (max-width:576px){

body{
    padding:10px;
    align-items:flex-start;
}

.container{
    width:100%;
    max-width:100%;
    padding:20px;
    border-radius:10px;
}

h2{
    font-size:22px;
}

label{
    font-size:15px;
}

input,
select,
textarea{
    font-size:14px;
    padding:10px;
}

.radio-group,
.checkbox-group{
    flex-direction:column;
    gap:8px;
}

button{
    font-size:16px;
    padding:11px;
}

#message{
    font-size:16px;
}

}

/* Small Mobile Devices */
@media screen and (max-width:400px){

.container{
    padding:15px;
}

h2{
    font-size:20px;
}

label{
    font-size:14px;
}

input,
select,
textarea{
    font-size:13px;
    padding:9px;
}

button{
    font-size:15px;
    padding:10px;
}

.login{
    font-size:14px;
}

}

</style>

</head>
<body>

<div class="container">

<h2>🎓 Student Registration</h2>

<form id="registerForm">

<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter Email" required>

<label>Student ID</label>
<input type="text" placeholder="Enter Student ID" required>

<label>Create Password</label>
<input type="password" placeholder="Enter Password" required>

<label>Confirm Password</label>
<input type="password" placeholder="Confirm Password" required>

<label>Gender</label>

<div class="radio-group">

<label><input type="radio" name="gender" required> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

<label>Course</label>

<select required>
<option value="">Select Course</option>
<option>MCA</option>
<option>BCA</option>
<option>MBA</option>
<option>B.Tech</option>
<option>B.Sc</option>
</select>

<label>Hobbies</label>

<div class="checkbox-group">

<label><input type="checkbox"> Reading</label>

<label><input type="checkbox"> Coding</label>

<label><input type="checkbox"> Sports</label>

<label><input type="checkbox"> Music</label>

</div>

<label>Address</label>

<textarea rows="3" placeholder="Enter Address"></textarea>

<button type="submit">Register</button>

</form>

<p id="message"></p>

<div class="login">
Already have an account?
<a href="index.html">Login</a>
</div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(e){

e.preventDefault();

document.getElementById("message").innerHTML="✅ Registration Successful!";

});

</script>

</body>
</html>
